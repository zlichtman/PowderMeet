# Resort catalog for the pipeline.
#
# bbox is [minLon, minLat, maxLon, maxLat] and only says where to look: extract
# picks the OpenSkiMap ski area it finds there and uses that area's extent.
# timezone is the IANA zone at the centre. status_provider is the live status
# source the backend asks (epic or mtnpowder here; liftie is not assigned to any
# resort yet). A resort with none, or whose official list cannot be fetched and
# matched to every lift, publishes as scheduled_only. aliases are other names
# the picker's search matches ("St. Anton" for Arlberg);
# publish writes them to resorts.aliases (migration 0020, which also seeds them).
defaults:
  snap_tolerance_m: 15      # a run end with no continuation is joined within this
  link_tolerance_m: 200     # a lift cut off from the network is joined within this
  orphan_join_m: 50         # a run touching nothing with a lift is tied in at both ends within this
  line_join_m: 40           # a run end is joined to another run's line (a T-junction) within this
  dem: {provider: terrarium, zoom: 14}
  default_hours:
    - {days: [1, 2, 3, 4, 5, 6, 7], open: "09:00", close: "16:00"}
