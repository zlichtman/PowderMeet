[project]
name = "powdermeet-pipeline"
version = "1.3.0"
description = "Builds immutable, content-addressed PowderMeet resort bundles."
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only for `pm-pipeline extract --pbf`.
pbf = ["osmium>=4"]

[project.scripts]
pm-pipeline = "powdermeet_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["powdermeet_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
