resort_id: heavenly
# Read from Heavenly's own winter trail map, shown on
# https://www.skiheavenly.com/the-mountain/about-the-mountain/trail-map.aspx:
# https://scene7.vailresorts.com/is/image/vailresorts/20241105_HV_winter-trail_map_001
# The status list drops "Express" from lift names and splits runs into Upper and
# Lower; each name joins the lift or run the map shows. Carpets, the tubing hill,
# parks and the Mott and Killebrew canyon areas are left as they are.

merges:
  # Lifts as the map names them.
  - id: lift:aerial-tramway
    kind: lift
    canonical_name: "Aerial Tramway"
    members:
      - {source: official, name: "The Tram"}
      - {source: osm, name: "Aerial Tramway"}
      - {source: openskimap, name: "Aerial Tramway"}
