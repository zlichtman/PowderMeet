resort_id: mammoth
# Read from Mammoth's own 2026-27 winter trail map, linked from
# https://www.mammothmountain.com/mountain/trail-map:
# https://sc.mammothmountain.com/-/media/project/mammoth/library/pdfs/maps/26-27_mmsa_trailmap_brochure_web.pdf
# The status list adds chair numbers to lift names and splits runs into Upper and
# Lower; each name joins the mapped lift or run the map shows. Parks, pipes,
# playgrounds, bowls and bluffs the map labels without a line are left as they are.

