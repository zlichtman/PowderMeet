resort_id: crystal-mountain
# Read from Crystal's own 2026-27 winter trail map, linked from
# https://www.crystalmountainresort.com/the-mountain/trail-maps:
# https://www.crystalmountainresort.com/-/media/crystal/images/2526-images/trail-maps/crystal_winter_2627_trail_map_heinz_and_updated_kiehls.jpg

merges:
  # The map and the resort's list drop "Run" from the three Ferk's.
  - id: trail:upper-ferks
    kind: trail
    canonical_name: "Upper Ferk's"
    members:
      - {source: official, name: "Upper Ferk's"}
      - {source: osm, name: "Upper Ferk's Run"}
      - {source: openskimap, name: "Upper Ferk's Run"}
  - id: trail:middle-ferks
    kind: trail
    canonical_name: "Middle Ferk's"
