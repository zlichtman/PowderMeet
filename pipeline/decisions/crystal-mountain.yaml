  - id: trail:sheppard
    kind: trail
    canonical_name: Sheppard
    members:
      - {source: official, name: Sheppard}
      - {source: osm, name: Sheppard}
      - {source: openskimap, name: Sheooard}

links:
  # Chair 6 tops out at Silver Queen; the map's runs under it start from the
  # unloading ramp, mapped 60 to 240 m away.
  - {from: n1407859956, to: n10879446502}   # Summit Chute
  - {from: n1407859956, to: n10879446504}   # Upper Field
  - {from: n1407859956, to: n10879243099}   # Chairline Left
  - {from: n1407859956, to: n10879260406}   # Screaming Babies
  - {from: n1407859956, to: n10879243103}   # Chairline Right
  - {from: n1407859956, to: n10879243093}   # Rabbit Ears
  - {from: n1407859956, to: n10879463006}   # Divider Chute
  - {from: n1407859956, to: n10879463008}   # Lower Field
  - {from: n1407859956, to: n10877089652}   # Double Ought's Left
  # The top of Blazing Elk lies on the ridge at Elk Pass, where Jeremy's Road
  # leaves for Upper Otto Bahn and the Northway chair; mapped 110 m apart.
  - {from: n10879463092, to: n3010961251}   # Blazing Elk -> Elk Pass

add_runs:
  # Campbell Basin is the bowl between Chair 6 and The Throne; it runs out to
  # Chair 6's bottom by the Campbell Basin Lodge.
  - name: Campbell Basin
    difficulty: double_black
    from: n1407859956          # top of Chair 6
    to: n1407859942            # bottom of Chair 6
    source: "https://www.crystalmountainresort.com/-/media/crystal/images/2526-images/trail-maps/crystal_winter_2627_trail_map_heinz_and_updated_kiehls.jpg"
  # Snorting Elk Bowl lies below the ridge between Elk Pass and Blazing Elk
  # and runs out onto Snorting Elk.
  - name: Snorting Elk Bowl
    difficulty: double_black
    from: n3010961251          # Elk Pass, start of Jeremy's Road
    to: n10879463094           # start of Snorting Elk
    source: "https://www.crystalmountainresort.com/-/media/crystal/images/2526-images/trail-maps/crystal_winter_2627_trail_map_heinz_and_updated_kiehls.jpg"
  # Blazing Elk starts at the top of Green Valley, through the G1 gate on
  # Grubstake Point, and follows the ridge to Elk Pass; OSM maps only its lower
  # part, from 350 m north. This is the way to Elk Pass, Jeremy's Road and the
  # Northway chair, otherwise cut off from the rest of the mountain.
  - name: Blazing Elk
    difficulty: black
    from: n1407884453          # top of Green Valley, start of Grubstake
    to: n10879463092           # start of the mapped Blazing Elk
    source: "https://www.crystalmountainresort.com/-/media/crystal/images/2526-images/trail-maps/crystal_winter_2627_trail_map_heinz_and_updated_kiehls.jpg"
