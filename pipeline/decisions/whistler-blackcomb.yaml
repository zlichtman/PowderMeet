resort_id: whistler-blackcomb
# Read from Whistler Blackcomb's own 2025-26 winter trail map:
# https://www.whistlerblackcomb.com/-/aemasset/sitecore/whistler-blackcomb/maps/winter-2025-2026/20251023_WB_winter-trail_map_001.pdf
# The resort's status list splits long runs into Upper, Mid and Lower sections
# that the map draws and names as one run; each section's name joins that run, so
# its status reaches it. Carpets, parks, pipes, kids-only zones and the bowls and
# entrances the map labels without a line are left as they are.

merges:
