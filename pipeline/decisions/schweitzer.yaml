resort_id: schweitzer
# Read from Schweitzer's own 2025-26 winter trail maps, linked from
# https://schweitzer.com/discover/trail-maps:
# Schweitzer Bowl: https://schweitzer.com/-/media/schweitzer/pdfs-and-maps/schweitzer-wintertrailmap-2025-26-1schweitzerbowl-lettersize.jpg
# Outback Bowl: https://schweitzer.com/-/media/schweitzer/pdfs-and-maps/maps/schweitzer-wintertrailmap-2025-26-2outbackbowl-web1920.jpg
# The status list splits runs into (upper) and (lower); each name joins the run the
# maps draw. Runouts, chutes and glades the maps label without a line are left.

merges:
  # Outback map: the Stella chair.
  - id: lift:stella
    kind: lift
    canonical_name: "Stella"
    members:
      - {source: official, name: "Stella Express"}
      - {source: osm, name: "Stella"}
      - {source: openskimap, name: "Stella"}
  # Both maps: the Sunnyside chair from the village.
  - id: lift:sunny-side
    kind: lift
    canonical_name: "Sunny Side"
    members:
      - {source: official, name: "Sunnyside Double"}
      - {source: osm, name: "Sunny Side"}
      - {source: openskimap, name: "Sunny Side"}
  # Schweitzer Bowl map: Jimmie's Run (J.R.), one run beside the Great Escape Quad.
  - id: trail:jimmies-run-j-r
    kind: trail
    canonical_name: "Jimmie's Run (J.R.)"
