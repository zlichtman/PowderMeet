# Outback map: Little Blue Ridge Run, the way down from the Idyle Our T-Bar, runs
# on to the Outback base by Cedar Park; its mapped end stops 218 m short.
links:
  - {from: n3338895553, to: n1696969681}
add_runs:
  # Misfortune: black, from the top of Colburn Triple down beside it.
  - name: "Misfortune"
    difficulty: black
    from: n3338890286    # top of Colburn Triple
    to: n7201609642      # bottom of Colburn Triple
    source: "https://schweitzer.com/-/media/schweitzer/pdfs-and-maps/maps/schweitzer-wintertrailmap-2025-26-2outbackbowl-web1920.jpg"
  # North Ridge: blue, along the ridge from Sky House to the Idyle Our T-Bar,
  # the way the Outback map shows to reach the T-bar.
  - name: "North Ridge"
    difficulty: blue
    from: n1692726605    # top of Great Escape Quad at Sky House
    to: n1429659560      # bottom of Idyle Our T-Bar
    source: "https://schweitzer.com/-/media/schweitzer/pdfs-and-maps/maps/schweitzer-wintertrailmap-2025-26-2outbackbowl-web1920.jpg"
